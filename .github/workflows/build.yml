name: Package Chrome extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Validate assets and JavaScript, then package extension
      run: python scripts/package.py
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: MrG-AI-Chrome-extension
        BUILD_PATHS: dist/*
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write

